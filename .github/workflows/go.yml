name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        go: ["1.22", "1.23", "1.24", "1.25", "1.26", "1.27"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{matrix.go}}

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
